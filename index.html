<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f12" />
  <title>Artotron — Арт-Барабан</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0f0f12;
      --bg-card: #17171d;
      --bg-elevated: #22222b;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-locked: rgba(255, 46, 147, 0.65);
      --text-primary: #f5f5f7;
      --text-secondary: #8e8e9e;
      --accent-start: #ff2e93;
      --accent-end: #ff5e62;
      --accent-gradient: linear-gradient(135deg, #ff2e93 0%, #ff5e62 100%);
      --accent-glow: 0 8px 28px rgba(255, 46, 147, 0.36);
      --accent-soft: rgba(255, 46, 147, 0.14);
      --success: #2ee59d;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 460px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 46, 147, 0.2) 0%, rgba(255, 94, 98, 0.06) 50%, transparent 72%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 460px;
      min-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: calc(10px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
      gap: 10px;
    }

    /* Centered Hero Header */
    .hero-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      padding-top: 2px;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .brand-art-img {
      height: 28px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 10px rgba(255, 46, 147, 0.35));
    }

    .brand-text-img {
      height: 18px;
      width: auto;
      object-fit: contain;
      opacity: 0.92;
    }

    .hero-question {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.05;
      margin-top: 2px;
    }

    .hero-question-top {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #ffffff;
      text-transform: uppercase;
    }

    .hero-question-accent {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 14px rgba(255, 46, 147, 0.35));
    }

    /* Centered Socials Row */
    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 2px;
    }

    .social-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
    }

    .social-btn svg {
      width: 17px;
      height: 17px;
    }

    .social-btn:active {
      transform: scale(0.91);
      border-color: var(--accent-start);
      color: #fff;
      background: var(--bg-elevated);
    }

    @media (hover: hover) {
      .social-btn:hover {
        border-color: rgba(255, 46, 147, 0.5);
        color: #fff;
      }
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 2px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .stat-pill strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    .stat-pill.has-locks {
      border-color: rgba(255, 46, 147, 0.45);
      background: var(--accent-soft);
      color: #ffb8d9;
    }

    .stat-pill.has-locks strong {
      color: #fff;
    }

    .sound-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.2s ease, opacity 0.2s ease;
      flex-shrink: 0;
    }

    .sound-pill:active {
      transform: scale(0.9);
    }

    .sound-pill.muted {
      opacity: 0.55;
      color: var(--text-secondary);
    }

    /* Cards Stack */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      justify-content: center;
    }

    .drum-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 12px 14px 12px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
      overflow: hidden;
    }

    .drum-card.is-locked {
      border-color: var(--border-locked);
      box-shadow: 0 0 0 1px rgba(255, 46, 147, 0.16), 0 8px 24px rgba(255, 46, 147, 0.12);
    }

    .drum-card.is-spinning {
      border-color: rgba(255, 94, 98, 0.55);
      box-shadow: 0 0 22px rgba(255, 46, 147, 0.18);
    }

    .drum-card.landed {
      animation: cardPop 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes cardPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.012); }
      100% { transform: scale(1); }
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .category-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
      min-width: 0;
    }

    .category-num {
      color: #ff4791;
      font-weight: 700;
      flex-shrink: 0;
    }

    .category-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .circle-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.14s ease, background-color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }

    .circle-btn img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .circle-btn:active {
      transform: scale(0.9);
    }

    .circle-btn.wat-btn:active {
      border-color: rgba(255, 46, 147, 0.6);
    }

    .circle-btn.lock-btn.active {
      background: var(--accent-gradient);
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(255, 46, 147, 0.4);
    }

    .circle-btn.refresh-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .circle-btn.refresh-btn.spinning img {
      animation: spinIcon 0.55s linear infinite;
    }

    @keyframes spinIcon {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Continuous Drum Viewport */
    .drum-viewport {
      position: relative;
      height: 94px;
      overflow: hidden;
      border-radius: 12px;
      background: rgba(11, 11, 15, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .drum-viewport::before {
      content: '';
      position: absolute;
      left: 8px;
      right: 8px;
      top: 50%;
      height: 36px;
      transform: translateY(-50%);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.035);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      pointer-events: none;
      z-index: 1;
    }

    .drum-viewport::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(14, 14, 18, 0.94) 0%,
        rgba(14, 14, 18, 0.25) 26%,
        rgba(14, 14, 18, 0) 42%,
        rgba(14, 14, 18, 0) 58%,
        rgba(14, 14, 18, 0.25) 74%,
        rgba(14, 14, 18, 0.94) 100%
      );
      pointer-events: none;
      z-index: 3;
    }

    .drum-drum {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .drum-slot-item {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 34px;
      margin-top: -17px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: 18.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      will-change: transform, opacity;
    }

    /* Bottom Dock */
    .bottom-dock {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding-top: 2px;
    }

    .copy-btn {
      width: 100%;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.14s ease, background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .copy-btn img {
      width: 16px;
      height: 16px;
      object-fit: contain;
      display: block;
    }

    .copy-btn:active {
      transform: scale(0.98);
      background: var(--bg-elevated);
    }

    .copy-btn.copied {
      border-color: rgba(46, 229, 157, 0.5);
      background: rgba(46, 229, 157, 0.12);
      color: var(--success);
    }

    .spin-all-btn {
      position: relative;
      width: 100%;
      height: 54px;
      border-radius: 16px;
      border: none;
      background: var(--accent-gradient);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--accent-glow);
      overflow: hidden;
      transition: transform 0.14s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }

    .spin-all-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.26), transparent);
      transform: skewX(-20deg);
      transition: left 0.55s ease;
    }

    .spin-all-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 16px rgba(255, 46, 147, 0.25);
    }

    .spin-all-btn:disabled {
      opacity: 0.75;
      cursor: wait;
    }

    .spin-all-btn.shimmer::before {
      left: 150%;
    }

    /* Info Modal ("Що це?") */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 8, 12, 0.76);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 360px;
      background: #1b1b23;
      border: 1px solid rgba(255, 46, 147, 0.35);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 30px rgba(255, 46, 147, 0.14);
      transform: scale(0.92) translateY(10px);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.open .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .modal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #ff6aa8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-close-x {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 16px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .modal-desc {
      font-size: 14px;
      line-height: 1.55;
      color: #c5c5d2;
      margin-bottom: 18px;
    }

    .modal-ok-btn {
      width: 100%;
      height: 44px;
      border-radius: 13px;
      border: none;
      background: var(--accent-gradient);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255, 46, 147, 0.3);
    }

    .modal-ok-btn:active {
      transform: scale(0.97);
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(128px + var(--safe-bottom));
      transform: translateX(-50%) translateY(16px);
      background: rgba(23, 23, 29, 0.96);
      border: 1px solid rgba(255, 46, 147, 0.45);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 50;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    .shake {
      animation: shake 0.35s ease;
    }

    @media (max-height: 700px) {
      .hero-question-top { font-size: 19px; }
      .hero-question-accent { font-size: 22px; }
      .drum-viewport { height: 82px; }
      .drum-slot-item { font-size: 17px; }
      .drum-card { padding: 10px 13px; }
      .spin-all-btn { height: 48px; }
      .copy-btn { height: 40px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Centered Hero Header -->
    <header class="hero-header">
      <div class="brand-lockup">
        <img src="./UI/Logo%20art.png" alt="Artotron" class="brand-art-img" />
        <img src="./UI/Logo%20text.png" alt="Artotron" class="brand-text-img" />
      </div>

      <h1 class="hero-question">
        <span class="hero-question-top">ЩО МАЛЮЄМО</span>
        <span class="hero-question-accent">СЬОГОДНІ?</span>
      </h1>

      <nav class="socials" aria-label="Соціальні мережі автора" id="socialsNav"></nav>
    </header>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-pill">
        <span>🎲</span>
        <span>Більше <strong>250 000</strong> поєднань</span>
      </div>
      <div class="stat-pill" id="lockedPill">
        <span>🔒</span>
        <span>Закріплено: <strong id="lockedCount">0</strong> з 3</span>
      </div>
      <button type="button" class="sound-pill" id="soundToggleBtn" aria-label="Звук" title="Увімкнути / вимкнути звук">
        <span id="soundIcon">🔊</span>
      </button>
    </div>

    <!-- 3 Drum Cards -->
    <main class="cards-stack">
      <!-- 01 -->
      <section class="drum-card" id="card-0">
        <div class="card-header">
          <div class="category-label">
            <span class="category-num">01</span>
            <span class="category-title">ПЕРСОНАЖ / ХТО?</span>
          </div>
          <div class="card-actions">
            <button type="button" class="circle-btn wat-btn" data-info="0" title="Що це?" aria-label="Що це?">
              <img src="./UI/wat.png" alt="?" />
            </button>
            <button type="button" class="circle-btn refresh-btn" data-refresh="0" title="Оновити персонажа" aria-label="Оновити персонажа">
              <img src="./UI/reroll.png" alt="Оновити" />
            </button>
            <button type="button" class="circle-btn lock-btn" data-lock="0" title="Замок" aria-label="Закріпити персонажа">
              <img src="./UI/lock.png" alt="Замок" class="lock-img" />
            </button>
          </div>
        </div>
        <div class="drum-viewport">
          <div class="drum-drum" id="drum-0"></div>
        </div>
      </section>

      <!-- 02 -->
      <section class="drum-card" id="card-1">
        <div class="card-header">
          <div class="category-label">
            <span class="category-num">02</span>
            <span class="category-title">ОБСТАВИНИ / ДЕ / СЮЖЕТ?</span>
          </div>
          <div class="card-actions">
            <button type="button" class="circle-btn wat-btn" data-info="1" title="Що це?" aria-label="Що це?">
              <img src="./UI/wat.png" alt="?" />
            </button>
            <button type="button" class="circle-btn refresh-btn" data-refresh="1" title="Оновити обставини" aria-label="Оновити обставини">
              <img src="./UI/reroll.png" alt="Оновити" />
            </button>
            <button type="button" class="circle-btn lock-btn" data-lock="1" title="Замок" aria-label="Закріпити обставини">
              <img src="./UI/lock.png" alt="Замок" class="lock-img" />
            </button>
          </div>
        </div>
        <div class="drum-viewport">
          <div class="drum-drum" id="drum-1"></div>
        </div>
      </section>

      <!-- 03 -->
      <section class="drum-card" id="card-2">
        <div class="card-header">
          <div class="category-label">
            <span class="category-num">03</span>
            <span class="category-title">СТИЛЬ / ПАЛІТРА / ЯК?</span>
          </div>
          <div class="card-actions">
            <button type="button" class="circle-btn wat-btn" data-info="2" title="Що це?" aria-label="Що це?">
              <img src="./UI/wat.png" alt="?" />
            </button>
            <button type="button" class="circle-btn refresh-btn" data-refresh="2" title="Оновити стиль" aria-label="Оновити стиль">
              <img src="./UI/reroll.png" alt="Оновити" />
            </button>
            <button type="button" class="circle-btn lock-btn" data-lock="2" title="Замок" aria-label="Закріпити стиль">
              <img src="./UI/lock.png" alt="Замок" class="lock-img" />
            </button>
          </div>
        </div>
        <div class="drum-viewport">
          <div class="drum-drum" id="drum-2"></div>
        </div>
      </section>
    </main>

    <!-- Bottom Controls -->
    <footer class="bottom-dock">

        osc.frequency.setValueAtTime(isLocked ? 480 : 620, now);
        osc.frequency.exponentialRampToValueAtTime(isLocked ? 720 : 400, now + 0.06);

        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);

        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      // Легкий UI-клік
      function pop() {
        const c = getCtx();
        if (!c) return;
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.045);

        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + 0.055);
      }

      return { unlock, isEnabled, toggle, tick, land, finishAll, lock, pop };
    })();

    function updateSoundUI() {
      const on = SoundFX.isEnabled();
      soundIcon.textContent = on ? '🔊' : '🔇';
      soundToggleBtn.classList.toggle('muted', !on);
    }

    function triggerHaptic(style = 'medium') {
      try {
        window.Telegram?.WebApp?.HapticFeedback?.impactOccurred(style);
      } catch (_) {}
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2200);
    }

    function openExternalUrl(item) {
      triggerHaptic('medium');
      if (tg) {
        if (item.url.startsWith('https://t.me/') && typeof tg.openTelegramLink === 'function') {
          tg.openTelegramLink(item.url);
          return;
        }
        if (typeof tg.openLink === 'function') {
          tg.openLink(item.url);
          return;
        }
      }
      window.open(item.url, '_blank', 'noopener,noreferrer');
    }

    function renderSocials() {
      socialsNav.innerHTML = '';
      AUTHOR_SOCIALS.forEach((item) => {
        const a = document.createElement('a');
        a.className = 'social-btn';
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.title = item.name;
        a.setAttribute('aria-label', item.name);
        a.innerHTML = item.svg;
        a.addEventListener('click', (e) => {
          e.preventDefault();
          openExternalUrl(item);
        });
        socialsNav.appendChild(a);
      });
    }

    function mod(n, m) {
      return ((n % m) + m) % m;
    }

    function getActiveIndex(catIdx) {
      const len = CATEGORIES[catIdx].length;
      return mod(Math.round(state.positions[catIdx]), len);
    }

    const drumNodes = [[], [], []];
    function initDrumNodes() {
      for (let catIdx = 0; catIdx < 3; catIdx++) {
        const container = document.getElementById(`drum-${catIdx}`);
        container.innerHTML = '';
        for (let offset = -VISIBLE_RANGE; offset <= VISIBLE_RANGE; offset++) {
          const el = document.createElement('div');
          el.className = 'drum-slot-item';
          container.appendChild(el);
          drumNodes[catIdx].push({ el, slotOffset: offset });
        }
      }
    }

    function renderDrum(catIdx) {
      const pos = state.positions[catIdx];
      const baseIdx = Math.floor(pos);
      const frac = pos - baseIdx;
      const pool = CATEGORIES[catIdx];
      const len = pool.length;

      const nodes = drumNodes[catIdx];
      for (let i = 0; i < nodes.length; i++) {
        const { el, slotOffset } = nodes[i];
        const virtualIdx = baseIdx + slotOffset;
        const itemIdx = mod(virtualIdx, len);
        const dist = slotOffset - frac;

        const y = dist * ITEM_STEP;
        const absDist = Math.abs(dist);
        const scale = Math.max(0.78, 1 - absDist * 0.14);
        const opacity = Math.max(0, 1 - absDist * 0.62);

        const label = pool[itemIdx][0];
        if (el.textContent !== label) {
          el.textContent = label;
        }
        el.style.transform = `translate3d(0, ${y.toFixed(2)}px, 0) scale(${scale.toFixed(3)})`;
        el.style.opacity = opacity.toFixed(3);
      }
    }

    function updateLockUI() {
      const lockedTotal = state.locked.filter(Boolean).length;
      lockedCountEl.textContent = String(lockedTotal);
      lockedPillEl.classList.toggle('has-locks', lockedTotal > 0);

      for (let i = 0; i < 3; i++) {
        const card = document.getElementById(`card-${i}`);
        const lockBtn = card.querySelector(`[data-lock="${i}"]`);
        const lockImg = lockBtn.querySelector('.lock-img');
        const refreshBtn = card.querySelector(`[data-refresh="${i}"]`);

        const isLocked = state.locked[i];
        card.classList.toggle('is-locked', isLocked);
        lockBtn.classList.toggle('active', isLocked);
        lockImg.src = isLocked ? './UI/lock2.png' : './UI/lock.png';
        refreshBtn.disabled = isLocked || state.spinning[i];
      }
    }

    function easeOutQuart(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    function spinCategory(catIdx, durationMs = 1500, extraItems = 24) {
      return new Promise((resolve) => {
        if (state.locked[catIdx] || state.spinning[catIdx]) {
          resolve();
          return;
        }

        state.spinning[catIdx] = true;
        const card = document.getElementById(`card-${catIdx}`);
        const refreshBtn = card.querySelector(`[data-refresh="${catIdx}"]`);

        card.classList.remove('landed');
        card.classList.add('is-spinning');
        refreshBtn.classList.add('spinning');
        refreshBtn.disabled = true;

        const startPos = Math.round(state.positions[catIdx]);
        const len = CATEGORIES[catIdx].length;
        const randomShift = extraItems + Math.floor(Math.random() * len);
        const targetPos = startPos + (randomShift % len === 0 ? randomShift + 1 : randomShift);

        const startTime = performance.now();
        let lastStep = Math.floor(startPos);

        function frame(now) {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / durationMs);
          const eased = easeOutQuart(progress);

          const currentPos = startPos + (targetPos - startPos) * eased;
          state.positions[catIdx] = currentPos;
          renderDrum(catIdx);

          const step = Math.floor(currentPos);
          if (step > lastStep) {
            lastStep = step;
            SoundFX.tick(catIdx);
          }

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            state.positions[catIdx] = targetPos;
            renderDrum(catIdx);
            state.spinning[catIdx] = false;
            card.classList.remove('is-spinning');
            card.classList.add('landed');
            refreshBtn.classList.remove('spinning');
            SoundFX.land(catIdx);
            updateLockUI();
            resolve();
          }
        }

        requestAnimationFrame(frame);
      });
    }

    async function handleSpinAll() {
      if (state.isSpinningAll) return;
      triggerHaptic('medium');

      const unlocked = [0, 1, 2].filter((i) => !state.locked[i]);
      if (unlocked.length === 0) {
        for (let i = 0; i < 3; i++) {
          const card = document.getElementById(`card-${i}`);
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
        }
        showToast('Усі категорії закріплено 🔒 Зніміть замок хоча б з однієї');
        return;
      }

      state.isSpinningAll = true;
      spinAllBtn.disabled = true;
      spinAllBtn.classList.remove('shimmer');
      void spinAllBtn.offsetWidth;
      spinAllBtn.classList.add('shimmer');

      const promises = unlocked.map((catIdx, order) => {
        const delay = order * 80;
        const duration = 1350 + order * 420;
        const extra = 22 + order * 8;
        return new Promise((res) => {
          setTimeout(() => {
            spinCategory(catIdx, duration, extra).then(res);
          }, delay);
        });
      });

      await Promise.all(promises);

      SoundFX.finishAll();
      state.isSpinningAll = false;
      spinAllBtn.disabled = false;
    }

    function openInfoModal(catIdx) {
      triggerHaptic('medium');
      SoundFX.pop();
      const idx = getActiveIndex(catIdx);
      const [title, desc] = CATEGORIES[catIdx][idx];

      modalBadge.textContent = CATEGORY_META[catIdx];
      modalTitle.textContent = title;
      modalDesc.textContent = desc;
      infoModal.classList.add('open');
    }

    function closeInfoModal() {
      infoModal.classList.remove('open');
    }

    async function handleCopy() {
      triggerHaptic('medium');

      const p1 = CATEGORIES[0][getActiveIndex(0)][0];
      const p2 = CATEGORIES[1][getActiveIndex(1)][0];
      const p3 = CATEGORIES[2][getActiveIndex(2)][0];

      const formatted = [
        '🎨 Арт-Барабан | Artotron',
        '',
        `01 Персонаж: ${p1}`,
        `02 Обставини: ${p2}`,
        `03 Стиль: ${p3}`
      ].join('\n');

      let copied = false;
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(formatted);
          copied = true;
        } catch (_) {}
      }

      if (!copied) {
        const textarea = document.createElement('textarea');
        textarea.value = formatted;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          copied = document.execCommand('copy');
        } catch (_) {
          copied = false;
        }
        document.body.removeChild(textarea);
      }

      if (copied) {
        SoundFX.pop();
        copyBtn.classList.add('copied');
        copyBtnText.textContent = 'Скопійовано!';
        showToast('✅ Завдання скопійовано в буфер обміну');
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtnText.textContent = 'Скопіювати завдання';
        }, 1800);
      } else {
        showToast('Не вдалося скопіювати автоматично');
      }
    }

    document.querySelectorAll('[data-info]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.info);
        openInfoModal(idx);
      });
    });

    document.querySelectorAll('[data-lock]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.lock);
        if (state.spinning[idx]) return;
        triggerHaptic('medium');
        state.locked[idx] = !state.locked[idx];
        SoundFX.lock(state.locked[idx]);
        updateLockUI();
      });
    });

    document.querySelectorAll('[data-refresh]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.refresh);
        if (state.locked[idx] || state.spinning[idx]) return;
        triggerHaptic('medium');
        SoundFX.unlock();
        spinCategory(idx, 1250, 20);
      });
    });

    soundToggleBtn.addEventListener('click', () => {
      triggerHaptic('medium');
      SoundFX.toggle();
      updateSoundUI();
    });

    modalCloseX.addEventListener('click', closeInfoModal);
    modalOkBtn.addEventListener('click', closeInfoModal);
    infoModal.addEventListener('click', (e) => {
      if (e.target === infoModal) closeInfoModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeInfoModal();
    });

    spinAllBtn.addEventListener('click', () => {
      SoundFX.unlock();
      handleSpinAll();
    });
    copyBtn.addEventListener('click', handleCopy);

    function init() {
      renderSocials();
      initDrumNodes();
      for (let i = 0; i < 3; i++) {
        state.positions[i] = Math.floor(Math.random() * CATEGORIES[i].length);
        renderDrum(i);
      }
      updateLockUI();
      updateSoundUI();
    }

    init();
  </script>
</body>
</html>
